[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "autocraftofexile"
version = "0.1.0"
description = "Console application for automating Craft of Exile recipes"
requires-python = ">=3.11"

dependencies = [
    "keyboard>=0.13.5",
    "pyautogui>=0.9.54",
    "requests>=2.32",
    "pywinctl>=0.4.1",
    "typer>=0.27.0",
    "pytweening>=1.2.0",
    "pyperclip>=1.11.0"
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]


[project.scripts]
autocraftofexile = "autocraftofexile.main:main"


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--import-mode=importlib",
    "-ra",
]
